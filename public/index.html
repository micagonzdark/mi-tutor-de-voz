<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor de Inglés con IA 🎤</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #c9d1ff;
      letter-spacing: 0.02em;
    }

    /* ── Orbe animado ── */
    .orb-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7c6fff, #3b2fc9 60%, #1a1060);
      box-shadow: 0 0 40px #5b4aff55, 0 0 80px #3b2fc920;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 1;
    }

    .orb.listening {
      animation: pulse-listen 1.2s ease-in-out infinite;
      box-shadow: 0 0 50px #5b4affaa, 0 0 100px #3b2fc955;
    }

    .orb.speaking {
      animation: pulse-speak 0.8s ease-in-out infinite;
      box-shadow: 0 0 60px #7c6fffcc, 0 0 120px #5b4aff66;
    }

    .orb.connecting {
      animation: pulse-slow 2s ease-in-out infinite;
      opacity: 0.6;
    }

    @keyframes pulse-listen {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes pulse-speak {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.12); }
      75% { transform: scale(1.06); }
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    /* Anillo exterior */
    .orb-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid #5b4aff33;
      animation: ring-expand 2s ease-out infinite;
    }
    .orb-ring:nth-child(1) { width: 140px; height: 140px; animation-delay: 0s; }
    .orb-ring:nth-child(2) { width: 160px; height: 160px; animation-delay: 0.5s; }
    .orb-ring:nth-child(3) { width: 180px; height: 180px; animation-delay: 1s; }

    @keyframes ring-expand {
      0% { opacity: 0.6; transform: scale(0.9); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    /* ── Estado ── */
    .status {
      font-size: 1rem;
      color: #8b92b8;
      min-height: 1.5rem;
      text-align: center;
    }

    .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5b4aff;
      margin-right: 6px;
      vertical-align: middle;
    }

    .status.connected .dot { background: #4ade80; }
    .status.error .dot { background: #f87171; }

    /* ── Botón ── */
    #connect-btn {
      padding: 0.9rem 2.5rem;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #5b4aff, #3b2fc9);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px #5b4aff44;
      letter-spacing: 0.03em;
    }

    #connect-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px #5b4aff66; }
    #connect-btn:active { transform: translateY(0); }
    #connect-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #disconnect-btn {
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      border: 2px solid #f8717155;
      background: transparent;
      color: #f87171;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }
    #disconnect-btn:hover { background: #f8717115; }

    /* ── Transcripción ── */
    .transcript-container {
      width: 100%;
      max-width: 600px;
      background: #1a1d2e;
      border-radius: 16px;
      border: 1px solid #2a2d45;
      padding: 1.2rem;
      min-height: 160px;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .transcript-container:empty::before {
      content: "La transcripción aparecerá aquí cuando empieces a hablar...";
      color: #3a3f5c;
      font-style: italic;
      font-size: 0.9rem;
    }

    .msg {
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 90%;
      animation: slide-in 0.2s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      background: #252a42;
      border-left: 3px solid #5b4aff;
      align-self: flex-end;
      color: #c9d1ff;
    }
    .msg.user::before { content: "Vos: "; font-weight: 600; color: #7c6fff; }

    .msg.ai {
      background: #1e2535;
      border-left: 3px solid #4ade80;
      align-self: flex-start;
      color: #d1fae5;
    }
    .msg.ai::before { content: "Tutor: "; font-weight: 600; color: #4ade80; }

    .msg.partial {
      opacity: 0.6;
      font-style: italic;
    }

    /* ── Error box ── */
    #error-box {
      display: none;
      background: #2d1515;
      border: 1px solid #f8717144;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      max-width: 520px;
      font-size: 0.9rem;
      color: #fca5a5;
      line-height: 1.6;
    }

    .buttons { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>

  <h1>🎤 Tutor de Inglés con IA</h1>

  <!-- Orbe animado -->
  <div class="orb-container">
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    <div class="orb" id="orb"></div>
  </div>

  <!-- Estado -->
  <p class="status" id="status">
    <span class="dot"></span>Listo para conectar
  </p>

  <!-- Botones -->
  <div class="buttons">
    <button id="connect-btn" onclick="connect()">🎙️ Empezar conversación</button>
    <button id="disconnect-btn" onclick="disconnect()">Terminar sesión</button>
  </div>

  <!-- Transcripción -->
  <div class="transcript-container" id="transcript"></div>

  <!-- Error -->
  <div id="error-box"></div>

  <script src="app.js"></script>
</body>
</html>
