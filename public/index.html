<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor de Inglés con IA 🎤</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      padding: 2rem;
    }

    h1 { font-size: 1.6rem; font-weight: 600; color: #c9d1ff; }

    /* ── Pantalla de setup ── */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      max-width: 480px;
      background: #1a1d2e;
      border: 1px solid #2a2d45;
      border-radius: 20px;
      padding: 2rem;
    }

    #setup-screen h2 {
      font-size: 1.1rem;
      color: #c9d1ff;
      text-align: center;
    }

    #setup-screen p {
      font-size: 0.88rem;
      color: #8b92b8;
      text-align: center;
      line-height: 1.6;
    }

    #setup-screen a { color: #7c6fff; text-decoration: none; }
    #setup-screen a:hover { text-decoration: underline; }

    .key-input-wrap {
      width: 100%;
      position: relative;
    }

    #api-key-input {
      width: 100%;
      padding: 0.8rem 3rem 0.8rem 1rem;
      border-radius: 10px;
      border: 1.5px solid #2a2d45;
      background: #0f1117;
      color: #e8eaf0;
      font-size: 0.95rem;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s;
    }
    #api-key-input:focus { border-color: #5b4aff; }

    #toggle-key-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #8b92b8;
      font-size: 1.1rem;
      padding: 4px;
    }

    #save-key-btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #5b4aff, #3b2fc9);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px #5b4aff44;
    }
    #save-key-btn:hover { transform: translateY(-2px); }
    #save-key-btn:active { transform: translateY(0); }

    /* ── App principal ── */
    #app-screen { display: none; flex-direction: column; align-items: center; gap: 1.8rem; width: 100%; }

    /* ── Orbe animado ── */
    .orb-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7c6fff, #3b2fc9 60%, #1a1060);
      box-shadow: 0 0 40px #5b4aff55, 0 0 80px #3b2fc920;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 1;
    }

    .orb.listening  { animation: pulse-listen 1.2s ease-in-out infinite; box-shadow: 0 0 50px #5b4affaa, 0 0 100px #3b2fc955; }
    .orb.speaking   { animation: pulse-speak  0.8s ease-in-out infinite; box-shadow: 0 0 60px #7c6fffcc, 0 0 120px #5b4aff66; }
    .orb.connecting { animation: pulse-slow   2s   ease-in-out infinite; opacity: 0.6; }

    @keyframes pulse-listen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes pulse-speak  { 0%,100%{transform:scale(1)} 25%{transform:scale(1.12)} 75%{transform:scale(1.06)} }
    @keyframes pulse-slow   { 0%,100%{opacity:.5} 50%{opacity:.8} }

    .orb-ring {
      position: absolute; border-radius: 50%;
      border: 2px solid #5b4aff33;
      animation: ring-expand 2s ease-out infinite;
    }
    .orb-ring:nth-child(1){width:140px;height:140px;animation-delay:0s}
    .orb-ring:nth-child(2){width:160px;height:160px;animation-delay:.5s}
    .orb-ring:nth-child(3){width:180px;height:180px;animation-delay:1s}
    @keyframes ring-expand { 0%{opacity:.6;transform:scale(.9)} 100%{opacity:0;transform:scale(1.1)} }

    /* ── Estado ── */
    .status { font-size: 1rem; color: #8b92b8; min-height: 1.5rem; text-align: center; }
    .status .dot { display:inline-block;width:8px;height:8px;border-radius:50%;background:#5b4aff;margin-right:6px;vertical-align:middle; }
    .status.connected .dot { background: #4ade80; }
    .status.error .dot { background: #f87171; }

    /* ── Botones ── */
    .buttons { display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:center; }

    #connect-btn {
      padding: .9rem 2.5rem; border-radius: 50px; border: none;
      background: linear-gradient(135deg,#5b4aff,#3b2fc9);
      color:white; font-size:1rem; font-weight:600; cursor:pointer;
      transition:all .2s; box-shadow:0 4px 20px #5b4aff44;
    }
    #connect-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px #5b4aff66}
    #connect-btn:active{transform:translateY(0)}
    #connect-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    #disconnect-btn {
      padding:.6rem 1.5rem;border-radius:50px;border:2px solid #f8717155;
      background:transparent;color:#f87171;font-size:.9rem;cursor:pointer;
      transition:all .2s;display:none;
    }
    #disconnect-btn:hover{background:#f8717115}

    #change-key-btn {
      padding:.5rem 1rem;border-radius:50px;border:1px solid #2a2d45;
      background:transparent;color:#8b92b8;font-size:.8rem;cursor:pointer;
      transition:all .2s;
    }
    #change-key-btn:hover{color:#c9d1ff;border-color:#5b4aff44}

    /* ── Transcripción ── */
    .transcript-container {
      width:100%;max-width:600px;background:#1a1d2e;
      border-radius:16px;border:1px solid #2a2d45;
      padding:1.2rem;min-height:160px;max-height:300px;
      overflow-y:auto;display:flex;flex-direction:column;gap:.6rem;
    }
    .transcript-container:empty::before {
      content:"La transcripción aparecerá aquí cuando empieces a hablar...";
      color:#3a3f5c;font-style:italic;font-size:.9rem;
    }

    .msg { padding:.6rem .9rem;border-radius:10px;font-size:.9rem;line-height:1.5;max-width:90%;animation:slide-in .2s ease; }
    @keyframes slide-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .msg.user { background:#252a42;border-left:3px solid #5b4aff;align-self:flex-end;color:#c9d1ff; }
    .msg.user::before { content:"Vos: ";font-weight:600;color:#7c6fff; }
    .msg.ai { background:#1e2535;border-left:3px solid #4ade80;align-self:flex-start;color:#d1fae5; }
    .msg.ai::before { content:"Tutor: ";font-weight:600;color:#4ade80; }
    .msg.partial { opacity:.6;font-style:italic; }

    /* ── Error box ── */
    #error-box {
      display:none;background:#2d1515;border:1px solid #f8717144;
      border-radius:12px;padding:1rem 1.2rem;max-width:520px;
      font-size:.9rem;color:#fca5a5;line-height:1.6;
    }
  </style>
</head>
<body>

  <h1>🎤 Tutor de Inglés con IA</h1>

  <!-- ── Pantalla de configuración (primera vez) ── -->
  <div id="setup-screen">
    <h2>🔑 Configuración inicial</h2>
    <p>
      Pegá tu clave de OpenAI acá abajo.<br>
      Solo se guarda en tu navegador — nadie más la ve.<br>
      La conseguís en <a href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com/api-keys</a>
    </p>
    <div class="key-input-wrap">
      <input
        type="password"
        id="api-key-input"
        placeholder="sk-proj-..."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="toggle-key-btn" onclick="toggleKeyVisibility()" title="Mostrar/ocultar">👁️</button>
    </div>
    <button id="save-key-btn" onclick="saveKey()">Guardar y empezar →</button>
  </div>

  <!-- ── App principal ── -->
  <div id="app-screen">
    <!-- Orbe animado -->
    <div class="orb-container">
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb" id="orb"></div>
    </div>

    <!-- Estado -->
    <p class="status" id="status">
      <span class="dot"></span>Listo para conectar
    </p>

    <!-- Botones -->
    <div class="buttons">
      <button id="connect-btn" onclick="connect()">🎙️ Empezar conversación</button>
      <button id="disconnect-btn" onclick="disconnect()">Terminar sesión</button>
      <button id="change-key-btn" onclick="changeKey()">Cambiar clave</button>
    </div>

    <!-- Transcripción -->
    <div class="transcript-container" id="transcript"></div>

    <!-- Error -->
    <div id="error-box"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
